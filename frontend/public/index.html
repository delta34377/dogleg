    <!--
      Link previews (iMessage, WhatsApp, Slack, X...). Preview bots don't run

    <!--
      Google Analytics with Consent Mode v2.
      The "consent default" lines MUST run before gtag('config', ...), so they
      come first:
        - EEA, UK and Switzerland: analytics/advertising cookies are OFF
          (privacy law there needs consent first).
        - Everywhere else: ON.
        - Anyone who chose on the Privacy page (localStorage
          'dogleg_analytics_optout'): '1' = OFF everywhere, '0' = analytics ON.
      The Privacy page's switch is in src/utils/analyticsConsent.js; keep the
      key and values in step with it.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var analyticsChoice = null;
      try {
        analyticsChoice = window.localStorage.getItem('dogleg_analytics_optout');
      } catch (e) {
        // Storage blocked (some private-browsing modes): use the defaults
      }

      var CONSENT_DENIED = {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      };

      if (analyticsChoice === '1') {
        // Turned off on the Privacy page: off everywhere
        gtag('consent', 'default', CONSENT_DENIED);
      } else {
        // EEA (EU + Iceland, Liechtenstein, Norway), UK and Switzerland
        gtag('consent', 'default', {
          analytics_storage: 'denied',
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          region: [
            'AT', 'BE', 'BG', 'CY', 'CZ', 'DE', 'DK', 'EE', 'ES', 'FI', 'FR',
            'GR', 'HR', 'HU', 'IE', 'IT', 'LT', 'LU', 'LV', 'MT', 'NL', 'PL',
            'PT', 'RO', 'SE', 'SI', 'SK', 'IS', 'LI', 'NO', 'GB', 'CH'
          ]
        });
        // Everywhere else
        gtag('consent', 'default', {
          analytics_storage: 'granted',
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted'
        });
        if (analyticsChoice === '0') {
          // Turned on on the Privacy page: analytics cookies allowed anywhere
          gtag('consent', 'update', { analytics_storage: 'granted' });
        }
      }

      gtag('js', new Date());
      gtag('config', 'G-5H72L3N9MF');
      // Google Ads (Dogleg account): lets the Sign-up conversion be measured.
      // The conversion itself fires from src/utils/adsConversion.js.
      gtag('config', 'AW-17893516910');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5H72L3N9MF"></script>
